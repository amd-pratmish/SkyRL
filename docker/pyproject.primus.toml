# SkyRL dependency view for Primus + Megatron on AMD ROCm.
#
# Used by docker/Dockerfile.primus-amd. The parent rocm/primus image already
# ships ROCm PyTorch, Transformer Engine, flash-attn, megatron-core, and RCCL.
# This file installs SkyRL runtime deps without pulling NVIDIA CUDA packages.
#
# Megatron-Bridge is intentionally omitted until we validate it on ROCm; the
# smoke test in integrations/primus_amd/ checks whether it can be added.

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skyrl*"]

[project]
name = "skyrl"
dynamic = ["version"]
description = "Unified API for training and inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0.0",
    "pillow>=11.3.0",
    "rich>=14.1.0",
    "safetensors>=0.6.2",
    "tokenizers>=0.21.2",
    "transformers>=5.6.1,<=5.8.0",
    "typer>=0.17.4",
    "peft==0.18.1",
    "hf_transfer",
    "cloudpathlib>=0.23.0",
    "zstandard>=0.23.0",
    "xxhash>=3.0.0",
]

[project.optional-dependencies]
tinker = [
    "tinker>=0.3.0,<=0.24.1",
    "fastapi[standard]",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "asyncpg",
    "psycopg2-binary",
]

skyrl-train = [
    "loguru",
    "tqdm",
    "ninja",
    "tensorboard",
    "func_timeout",
    "hydra-core==1.3.2",
    "accelerate",
    "torchdata",
    "omegaconf",
    "ray==2.57.0",
    "peft==0.18.1",
    "debugpy==1.8.0",
    "hf_transfer",
    "wandb",
    "datasets>=4.0.0",
    "tensordict",
    "jaxtyping",
    "skyrl-gym",
    "polars",
    "s3fs",
    "fastapi",
    "orjson>=3.11.9",
    "pybase64>=1.4.2",
    "uvicorn",
    "vllm-router; sys_platform == 'linux'",
    "pybind11",
    "setuptools",
]

# FSDP path (vLLM ROCm from parent image when using Dockerfile.amd).
fsdp = [
    "skyrl[skyrl-train]",
]

# Megatron on Primus/ROCm: install megatron-core 0.19 + megatron-bridge via approach_a_install.sh
primus-megatron = [
    "skyrl[skyrl-train]",
    "flash-linear-attention; sys_platform == 'linux'",
]

# Full Approach A (Megatron-Bridge path on AMD): use integrations/primus_amd/approach_a_install.sh
# inside rocm/primus:v26.4 — pins megatron-core and megatron-bridge from git, not PyPI CUDA wheels.
primus-megatron-bridge = [
    "skyrl[primus-megatron]",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "skyrl.__version__"}

[tool.uv]
required-environments = [
    "sys_platform == 'linux'",
]

[tool.uv.sources]
skyrl-gym = { path = "./skyrl-gym", editable = true }

vllm-router = [
    { url = "https://github.com/SumanthRH/router/releases/download/0.1.14.post1/vllm_router-0.1.14-cp38-abi3-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/SumanthRH/router/releases/download/0.1.14.post1/vllm_router-0.1.14-cp38-abi3-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
